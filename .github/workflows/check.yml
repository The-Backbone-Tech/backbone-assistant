name: check

# Public source publication does not automatically run hosted jobs.
# Dispatch explicitly when a maintainer chooses to qualify a public revision.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Commit trailers name the agent
        if: github.event_name == 'pull_request'
        run: |
          for c in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$c" | grep -Eq '^Agent: .+' || { echo "commit $c has no Agent: trailer"; exit 1; }
          done

  slow:
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Install scripts stay off (.npmrc); Electron's binary is fetched by its own step below.
      - run: pnpm install --frozen-lockfile
      - name: Chromium for platform browser work and app journeys
        run: pnpm --filter @backbone-next/app exec playwright install --with-deps chromium
      - name: Let Chromium's sandbox start (Ubuntu 24.04 restricts unprivileged user namespaces)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Platform port tests
        run: pnpm --filter @backbone-next/platform test
      - name: App tests
        run: pnpm --filter @backbone-next/app test
      - name: Command line tests
        run: pnpm --filter @backbone-next/cli test
      - name: Typecheck
        run: pnpm --filter @backbone-next/platform typecheck && pnpm --filter @backbone-next/app typecheck && pnpm --filter @backbone-next/cli typecheck
      - name: Electron binary
        run: pnpm --filter @backbone-next/app electron:install
      - name: J-01 journeys (browser at 1440, 375 and 320 px in Light and Dark; Electron)
        run: xvfb-run -a pnpm --filter @backbone-next/app e2e
      - name: Keep the J-01 evidence (never committed)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: j01-evidence
          path: evidence/J-01
          if-no-files-found: ignore
          retention-days: 14
      - name: Oracle against the successor
        # Red until every area (scenes, lifecycle, journeys included) passes; then delete continue-on-error.
        continue-on-error: true
        run: pnpm oracle
