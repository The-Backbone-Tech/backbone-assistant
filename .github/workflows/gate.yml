# Delta verification: unchanged runtime proof is retained in run 43665566626.
name: Public source metadata and self-tests
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact public source revision to verify
        required: true
permissions:
  contents: read
jobs:
  metadata:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @backbone-next/app electron:install
      - name: Verify public source metadata and check-script tests
        run: |
          mkdir -p .csv-evidence
          git rev-parse HEAD > .csv-evidence/source.txt
          BACKBONE_GUIDE_STEP=1 node scripts/check.mjs > .csv-evidence/static.log 2>&1
          node --test --test-concurrency=1 scripts/*.test.mjs > .csv-evidence/self-tests.log 2>&1
      - name: Retain delta evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: csv-metadata-macos
          path: .csv-evidence/
          include-hidden-files: true
          if-no-files-found: error
