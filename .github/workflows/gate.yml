# One-off public binary build. Product source is checked out at the fixed source release,
# independently of this workflow-only branch. No release is published automatically.
name: Public pre-release 8 macOS build
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact published source commit
        required: true
        default: 46876913fb10fe2d652083b03cfa2971513db1f3
      test_scope:
        description: Full installed qualification or focused boundary diagnosis
        type: choice
        options: [full, pi-sandbox]
        default: full
permissions:
  contents: read
jobs:
  macos-public-binary:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SOURCE_COMMIT: 46876913fb10fe2d652083b03cfa2971513db1f3
      PUBLIC_SOURCE: /private/tmp/backbone-public-source
      TEST_SCOPE: ${{ inputs.test_scope }}
      BACKBONE_PUBLIC_DISTRIBUTION: '1'
      BACKBONE_DISTRIBUTION: /private/tmp/backbone-public-source/distributions/backbone/distribution.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
      - name: Isolate the exact public source under a neutral build path
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          test ! -e "$PUBLIC_SOURCE"
          git clone --no-hardlinks "$GITHUB_WORKSPACE" "$PUBLIC_SOURCE"
          git -C "$PUBLIC_SOURCE" remote set-url origin https://github.com/The-Backbone-Tech/backbone-assistant.git
          test "$(git -C "$PUBLIC_SOURCE" rev-parse HEAD)" = "$SOURCE_COMMIT"
          node -e "if(process.platform!=='darwin'||process.arch!=='arm64')process.exit(1)"
          command -v gpg || brew install gnupg
      - name: Install exact dependencies with install scripts disabled
        working-directory: /private/tmp/backbone-public-source
        run: pnpm install --frozen-lockfile
      - name: Verify the source export and public metadata
        working-directory: /private/tmp/backbone-public-source
        run: |
          node --test scripts/public-tree.test.mjs
          BACKBONE_GUIDE_STEP=1 node scripts/check.mjs
          node --test packages/platform/test/harness-messages.test.ts
      - name: Install Chromium required by the full installed selection
        working-directory: /private/tmp/backbone-public-source
        run: pnpm --filter @backbone-next/app exec playwright install chromium
      - name: Build the unmodified pinned GNU shared libraries
        working-directory: /private/tmp/backbone-public-source
        run: node scripts/native-lgpl/build.mjs
      - name: Package and run the selected installed app checks
        id: installed
        timeout-minutes: 25
        working-directory: /private/tmp/backbone-public-source
        shell: bash
        run: |
          case "$TEST_SCOPE" in
            full) pnpm --filter @backbone-next/app e2e:installed ;;
            pi-sandbox) pnpm --filter @backbone-next/app e2e:installed --grep '^Pi shell is confined on macOS' ;;
            *) echo 'Unknown verification scope' >&2; exit 1 ;;
          esac
      - name: Check the libraries extracted from the actual disk image
        if: always()
        id: native_smoke
        working-directory: /private/tmp/backbone-public-source/packages/surfaces/app
        shell: bash
        run: |
          node scripts/install-dmg.mjs "$RUNNER_TEMP/public-native-check"
          node ../../../scripts/native-lgpl/smoke.mjs "$RUNNER_TEMP/public-native-check/Backbone.app/Contents/Resources/postgres/native"
      - name: Verify source and retain the exact artifact even after a test failure
        if: always()
        id: stage
        env:
          INSTALLED_TEST_OUTCOME: ${{ steps.installed.outcome }}
          NATIVE_SMOKE_OUTCOME: ${{ steps.native_smoke.outcome }}
        working-directory: /private/tmp/backbone-public-source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,mkdirSync,copyFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const info=JSON.parse(readFileSync('packages/surfaces/app/dist/package/build.json'));
          if(info.compiled.revision!==process.env.SOURCE_COMMIT||info.compiled.dirty!==false||info.sourceChangedAfterBuild!==false||info.arch!=='arm64'||info.signed!==false)throw Error('Public build provenance mismatch');
          const out=join(process.env.RUNNER_TEMP,'public-macos-artifacts');mkdirSync(out,{recursive:true});
          const asset=join('packages/surfaces/app',info.dmg),data=readFileSync(asset);
          if(createHash('sha256').update(data).digest('hex')!==info.sha256)throw Error('DMG digest mismatch');
          copyFileSync(asset,join(out,'backbone-0.2.0-arm64.dmg'));
          copyFileSync('packages/surfaces/app/dist/package/build.json',join(out,'app-build.json'));
          copyFileSync('packages/surfaces/app/dist/notices/index.json',join(out,'bundled-notice-index.json'));
          copyFileSync('dist/native-lgpl/output/build.json',join(out,'native-lgpl-build.json'));
          for(const file of ['libiconv-1.18.tar.gz','libiconv-1.18.tar.gz.sig','gettext-0.26.tar.gz','gettext-0.26.tar.gz.sig'])copyFileSync(join('dist/native-lgpl/downloads',file),join(out,file));
          const hash=file=>createHash('sha256').update(readFileSync(file)).digest('hex');
          writeFileSync(join(out,'hosted-provenance.json'),JSON.stringify({sourceCommit:process.env.SOURCE_COMMIT,sourceTree:execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),workflowCommit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,runUrl:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,runnerImage:process.env.ImageOS,runnerImageVersion:process.env.ImageVersion,macOS:execFileSync('sw_vers',['-productVersion'],{encoding:'utf8'}).trim(),node:process.version,arch:process.arch,pnpm:execFileSync('pnpm',['--version'],{encoding:'utf8'}).trim(),lockSha256:hash('pnpm-lock.yaml'),distributionSha256:hash('distributions/backbone/distribution.json'),dmgSha256:info.sha256,buildId:info.compiled.id,verificationScope:process.env.TEST_SCOPE,installedTestOutcome:process.env.INSTALLED_TEST_OUTCOME,nativeSmokeOutcome:process.env.NATIVE_SMOKE_OUTCOME,checks:['fixed clean published source','public-distribution GNU source/signature/recipe checks','installed selection outcome recorded separately','actual extracted PostgreSQL/libintl smoke outcome recorded separately'],signed:false,notarised:false,publicPrivacyReview:'required separately before release publication'},null,2)+'\n');
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.stage.outcome == 'success'
        with:
          name: public-macos-arm64-build
          path: ${{ runner.temp }}/public-macos-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Retain focused test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-macos-build-diagnostics
          path: |
            /private/tmp/backbone-public-source/evidence/J-01/
            /private/tmp/backbone-public-source/packages/surfaces/app/test-results/
          if-no-files-found: ignore
          retention-days: 3
