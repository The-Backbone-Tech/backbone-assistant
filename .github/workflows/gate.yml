# Manually dispatched; each result qualifies only the source and runner it records.
name: Qualification gate
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to qualify
        required: true
        default: main
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        check: [gate, install]
    runs-on: ubuntu-latest
    env:
      # The home lock's Linux backend is still experimental and off by default; CI opts in for the
      # whole job so every suite that opens a home runs on Linux. Remove when the backend is released.
      BACKBONE_EXPERIMENTAL_LINUX_HOME_LOCK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Reads the exact pnpm version from packageManager.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pinned sandbox needs bubblewrap/user namespaces; its owned syscall audit uses system Python.
      - name: Install Linux runtime libraries
        if: matrix.check == 'gate'
        run: sudo apt-get update && sudo apt-get install -y libatomic1 libicu-dev zlib1g xvfb bubblewrap python3
      - if: matrix.check == 'gate'
        run: pnpm --filter @backbone-next/app electron:install
      - if: matrix.check == 'gate'
        run: pnpm --filter @backbone-next/app exec playwright install --with-deps chromium
      # Ubuntu runners restrict unprivileged user namespaces through AppArmor, which stops the
      # Chromium sandbox the Electron end-to-end suite starts and the native Codex bubblewrap sandbox.
      # Relaxed on this throwaway runner only;
      # never a setting for a person's computer.
      - if: matrix.check == 'gate'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The probe uses a synthetic HOME, with no account or model call.
      - name: Qualify the pinned native Codex Linux sandbox
        if: matrix.check == 'gate'
        run: |
          # Linux :minimal reads system runtime roots, not the runner's /home or /opt tool caches.
          # Install the maintained binaries under /usr; do not widen the permission map for CI.
          # This owned prefix is only for the disposable CI VM, not a personal-machine install.
          # It is absent from later steps' PATH so discovery tests cannot select a real account.
          sandbox_prefix=/usr/local/lib/codex-qualification
          sudo mkdir -p "$sandbox_prefix/bin"
          sudo install -m 0755 "$(command -v node)" "$sandbox_prefix/bin/node"
          # npm ci verifies checked-in integrity hashes for the client and platform binaries.
          sudo cp scripts/codex-qualification/package.json scripts/codex-qualification/package-lock.json "$sandbox_prefix/"
          sudo "$(command -v npm)" ci --prefix "$sandbox_prefix" --ignore-scripts --no-audit --no-fund
          export PATH="$sandbox_prefix/bin:$sandbox_prefix/node_modules/.bin:$PATH"
          # Keep failures actionable: all native state below is synthetic, never a person's login.
          command -v node
          node --version
          command -v codex
          codex --version
          command -v bwrap
          bwrap --version
          find "$sandbox_prefix/node_modules/@openai" -maxdepth 12 -type f \( -name codex -o -name '*sandbox*' -o -name bwrap \) -print
          uname -a
          sysctl kernel.unprivileged_userns_clone user.max_user_namespaces kernel.apparmor_restrict_unprivileged_userns || true
          grep Seccomp /proc/self/status
          cat /sys/kernel/security/lsm || true
          grep -E 'CONFIG_(SECCOMP|SECURITY_LANDLOCK|USER_NS)=' "/boot/config-$(uname -r)" || true
          # Owned audit sockets under /run are visible to full and hidden by contained.
          sudo install -m 0755 packages/modules/harness-codex/test/linux-security-probe.py "$sandbox_prefix/bin/linux-security-probe.py"
          sudo install -d -m 0700 -o "$(id -u)" /run/backbone-codex-qualification
          export BACKBONE_CODEX_SECURITY_PROBE="$sandbox_prefix/bin/linux-security-probe.py"
          export BACKBONE_CODEX_AUDIT_RUN_ROOT=/run/backbone-codex-qualification
          probe_status=0
          node packages/modules/harness-codex/test/sandbox-probe.mjs || probe_status=1
          # Prove read-only Host immutability and fresh-namespace isolation under both temp parents.
          TMPDIR=/var/tmp node packages/modules/harness-codex/test/sandbox-probe.mjs || probe_status=1
          node packages/modules/harness-codex/test/readonly-probes.mjs || probe_status=1
          node packages/modules/harness-codex/test/linux-security-probe.mjs || probe_status=1
          exit "$probe_status"
      - if: matrix.check == 'gate'
        run: xvfb-run -a pnpm gate --out .gate/ci
      - if: matrix.check == 'install'
        run: bash scripts/linux-install-smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.check == 'gate'
        with:
          name: gate-evidence
          path: |
            .gate/ci/gate-summary.txt
            .gate/ci/gate.json
            .gate/ci/*.log
          if-no-files-found: warn
  # The gate has run on one Mac since the project began, so every unit waited for that machine.
  # This job runs the same `pnpm gate` on a hosted Apple-silicon runner, so a unit branch can be
  # qualified without the shared machine. Not yet qualified: until it has matched the local gate on
  # two consecutive heads, the local run stays the acceptance record for the Mac.
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Initialize gate evidence before setup
        run: |
          mkdir -p .gate/ci
          echo '{"overall":"not-started","suites":[]}' > .gate/ci/gate.json
          echo 'Gate not started; preparing hosted runner' > .gate/ci/gate-summary.txt
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Reads the exact pnpm version from packageManager.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @backbone-next/app electron:install
      - run: pnpm --filter @backbone-next/app exec playwright install chromium
      # Reserve time for later suites and artifact upload when a suite stalls. This remains a
      # failure, including the macOS 15 snapshot defect; it does not relax product assertions.
      - run: pnpm gate --out .gate/ci --suite-timeout 10
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gate-evidence-macos
          path: |
            .gate/ci/gate-summary.txt
            .gate/ci/gate.json
            .gate/ci/*.log
          include-hidden-files: true
          if-no-files-found: error
  windows-experimental:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Reads the exact pnpm version from packageManager.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package and check fresh-home diagnosis
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'backbone-package'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $tarball = node scripts/pack-cli.mjs $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install -g --prefix "$dir/prefix" --no-audit --no-fund $tarball
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:BACKBONE_HOME = Join-Path $dir 'fresh-home'
          & "$dir/prefix/backbone.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $doctor = & "$dir/prefix/backbone.cmd" doctor
          $status = $LASTEXITCODE
          $doctor | Out-Host
          if ($status -ne 1 -or ($doctor -join "`n") -notmatch 'BACKBONE_KEYS=plaintext backbone projects create') { exit 1 }
