# Finite source verification; no release or default-branch change.
name: CSV working-material verification
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact public source revision to verify
        required: true
permissions:
  contents: read
jobs:
  csv:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @backbone-next/app electron:install
      - run: pnpm --filter @backbone-next/app exec playwright install chromium
      - name: Record exact source and run focused model checks
        run: |
          mkdir -p .csv-evidence
          git rev-parse HEAD > .csv-evidence/source.txt
          node --test packages/surfaces/app/test/csv-table.test.ts packages/surfaces/app/test/document-preview.test.ts packages/surfaces/app/test/preview-failures.test.ts > .csv-evidence/model.log 2>&1
      - name: Typecheck and build the app
        run: |
          pnpm --filter @backbone-next/app typecheck > .csv-evidence/typecheck.log 2>&1
          pnpm --filter @backbone-next/app build > .csv-evidence/build.log 2>&1
      - name: Three complete browser journeys on one owned database cluster
        env:
          BACKBONE_CSV_SCREENSHOTS: ${{ github.workspace }}/.csv-evidence/screenshots
        run: |
          node scripts/no-leftovers.mjs node scripts/with-test-cluster.mjs pnpm --dir packages/surfaces/app exec playwright test e2e/csv-table.browser.spec.ts --project=browser-light-1440 --project=browser-dark-1440 --project=browser-light-375 --workers=1 > .csv-evidence/browser.log 2>&1
      - name: Check dependency installation outside the checkout
        if: always()
        run: |
          mkdir -p .csv-evidence
          pnpm test:install > .csv-evidence/install.log 2>&1
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: csv-verification-macos
          path: |
            .csv-evidence/
            evidence/J-01/playwright-output/
          include-hidden-files: true
          if-no-files-found: error
