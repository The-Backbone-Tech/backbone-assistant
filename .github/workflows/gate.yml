name: Qualify the retained public Mac image
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact source of the retained image
        required: true
        default: 46876913fb10fe2d652083b03cfa2971513db1f3
permissions:
  contents: read
  actions: read
jobs:
  qualify-retained-image:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      SOURCE_COMMIT: 46876913fb10fe2d652083b03cfa2971513db1f3
      DMG_SHA256: 80e2157547e6132419e144a5644c9360cbdc6083efccbd5052dbcdf7ee65e74a
      BUILD_ID: 5b1b676a-1246-4af5-9a54-e3a32ee24077
      PUBLIC_SOURCE: /private/tmp/backbone-public-source
      BACKBONE_DISTRIBUTION: /private/tmp/backbone-public-source/distributions/backbone/distribution.json
      BACKBONE_PUBLIC_DISTRIBUTION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
      - name: Isolate the fixed clean source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          git clone --no-hardlinks "$GITHUB_WORKSPACE" "$PUBLIC_SOURCE"
          git -C "$PUBLIC_SOURCE" remote set-url origin https://github.com/The-Backbone-Tech/backbone-assistant.git
          node -e "if(process.platform!=='darwin'||process.arch!=='arm64')process.exit(1)"
          mkdir -p "$RUNNER_TEMP/image-qualification"
      - name: Install pinned test dependencies
        working-directory: /private/tmp/backbone-public-source
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @backbone-next/app electron:install
          pnpm --filter @backbone-next/app exec playwright install chromium
      - name: Download and verify the exact retained image
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: /private/tmp/backbone-public-source
        run: |
          gh api repos/The-Backbone-Tech/backbone-assistant/actions/artifacts/14162857025/zip > "$RUNNER_TEMP/retained-image.zip"
          python3 - <<'PY'
          import os,zipfile,hashlib,json,shutil,stat
          from pathlib import Path
          root=Path(os.environ['PUBLIC_SOURCE']);out=Path(os.environ['RUNNER_TEMP'])/'image-qualification';p=Path(os.environ['RUNNER_TEMP'])/'retained-image.zip'
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='b50271fc5ed46a416fdecbc28b8b5b2173443453a4448818bc136a5ff1dbacaa'
          expected={'app-build.json','backbone-0.2.0-arm64.dmg','bundled-notice-index.json','gettext-0.26.tar.gz','gettext-0.26.tar.gz.sig','hosted-provenance.json','libiconv-1.18.tar.gz','libiconv-1.18.tar.gz.sig','native-lgpl-build.json'}
          with zipfile.ZipFile(p) as z:
            assert set(z.namelist())==expected and len(z.namelist())==len(expected)
            assert all(not stat.S_ISLNK(x.external_attr>>16) for x in z.infolist())
            z.extractall(out/'original-build')
          files=out/'original-build';info=json.loads((files/'app-build.json').read_text())
          assert info['compiled']['revision']==os.environ['SOURCE_COMMIT'] and info['compiled']['id']==os.environ['BUILD_ID']
          assert info['compiled']['dirty'] is False and info['sourceChangedAfterBuild'] is False
          assert info['dmg']=='dist/package/backbone-0.2.0-arm64.dmg'
          assert hashlib.sha256((files/'backbone-0.2.0-arm64.dmg').read_bytes()).hexdigest()==info['sha256']==os.environ['DMG_SHA256']
          app=root/'packages/surfaces/app';(app/'dist/package').mkdir(parents=True,exist_ok=True)
          shutil.copy2(files/'backbone-0.2.0-arm64.dmg',app/info['dmg']);shutil.copy2(files/'app-build.json',app/'dist/package/build.json')
          (app/'dist/build.json').write_text(json.dumps(info['compiled'],indent=2)+'\n')
          print('Exact retained image verified; no rebuild performed')
          PY
      - name: Install the retained image into an owned probe folder
        working-directory: /private/tmp/backbone-public-source/packages/surfaces/app
        run: node scripts/install-dmg.mjs "$RUNNER_TEMP/image-qualification/probe-app"
      - name: Bound the supplier and packaged Chromium readiness probes
        id: preflight
        timeout-minutes: 4
        working-directory: /private/tmp/backbone-public-source/packages/surfaces/app
        env:
          DEBUG: pw:browser
        run: |
          node --input-type=module <<'JS' 2>&1 | tee "$RUNNER_TEMP/image-qualification/preflight.log"
          import {createRequire} from 'node:module';
          import {mkdtempSync,mkdirSync,writeFileSync,readFileSync} from 'node:fs';
          import {join,dirname} from 'node:path';
          import {spawnSync} from 'node:child_process';
          const require=createRequire(process.cwd()+'/package.json'),{_electron:electron}=require('@playwright/test');
          const out=join(process.env.RUNNER_TEMP,'image-qualification'),root=mkdtempSync(join(process.env.RUNNER_TEMP,'bootstrap-'));
          const flag=k=>process.env[k]===undefined?'unset':['','0','1'].includes(process.env[k])?process.env[k]:'other';
          const report={sourceCommit:process.env.SOURCE_COMMIT,dmgSha256:process.env.DMG_SHA256,buildId:process.env.BUILD_ID,ambientElectronMode:{runAsNode:flag('ELECTRON_RUN_AS_NODE'),noAsar:flag('ELECTRON_NO_ASAR')},probes:[]};
          const base={...process.env};delete base.ELECTRON_RUN_AS_NODE;delete base.ELECTRON_NO_ASAR;delete base.GH_TOKEN;
          const control=join(root,'control.cjs');writeFileSync(control,"const {app,BrowserWindow}=require('electron');app.whenReady().then(()=>{const w=new BrowserWindow({show:false});w.loadURL('data:text/html,<title>Supplier control</title>');});\n");
          const testRequire=createRequire(require.resolve('@playwright/test/package.json')),playwrightRequire=createRequire(testRequire.resolve('playwright/package.json'));
          const loader=join(dirname(playwrightRequire.resolve('playwright-core/package.json')),'lib/server/electron/loader.js');
          for(const kind of ['supplier','retained']){
            let app;const begun=Date.now(),home=join(root,kind+'-home'),person=join(root,kind+'-person');mkdirSync(home);mkdirSync(person);
            const executable=kind==='supplier'?require('electron'):join(out,'probe-app/Backbone.app/Contents/MacOS/Backbone');
            const args=kind==='supplier'?['-r',loader,control,'--user-data-dir='+join(root,'control-profile')]:[];
            const timer=setTimeout(()=>spawnSync('screencapture',['-x',join(out,kind+'-waiting.png')],{timeout:10000}),8000);
            try{
              app=await electron.launch({executablePath:executable,args,timeout:25000,env:{...base,BACKBONE_HOME:home,BACKBONE_USER_HOME:person,BACKBONE_HARNESS:'harness-pi',BACKBONE_MODEL_ENDPOINT:'http://127.0.0.1:1/v1',BACKBONE_MODEL_ID:'bootstrap'}});
              const page=await app.firstWindow({timeout:20000});
              if(kind==='supplier')await page.waitForLoadState('domcontentloaded',{timeout:15000});
              else await page.locator('[data-ready=true]').waitFor({state:'visible',timeout:45000});
              report.probes.push({kind,executable,ready:true,durationMs:Date.now()-begun});
            }catch(error){report.probes.push({kind,executable,ready:false,durationMs:Date.now()-begun,error:String(error)});}
            finally{clearTimeout(timer);if(app){try{await Promise.race([app.close(),new Promise((_,reject)=>setTimeout(()=>reject(Error('Owned probe did not close')),15000))]);}catch(error){app.process().kill('SIGKILL');report.probes.push({kind,closeFailed:String(error)});}}}
          }
          writeFileSync(join(out,'preflight.json'),JSON.stringify(report,null,2)+'\n');
          if(report.probes.length!==2||report.probes.some(p=>!p.ready))process.exitCode=1;
          JS
      - name: Run the complete unchanged installed selection on the same image
        id: installed
        timeout-minutes: 25
        working-directory: /private/tmp/backbone-public-source/packages/surfaces/app
        run: |
          cat > "$RUNNER_TEMP/qualify-retained.mjs" <<'JS'
          import {readFileSync} from 'node:fs';
          import {execFileSync,spawnSync} from 'node:child_process';
          import {INSTALLED_TEST_ARGS,runInstalledJourney} from '/private/tmp/backbone-public-source/packages/surfaces/app/scripts/installed-journey.ts';
          const run=(args)=>execFileSync(process.execPath,args,{encoding:'utf8'});
          const env={...process.env};delete env.ELECTRON_RUN_AS_NODE;delete env.ELECTRON_NO_ASAR;delete env.GH_TOKEN;
          const result=await runInstalledJourney({prepare(){const info=JSON.parse(readFileSync('dist/package/build.json'));if(info.compiled.revision!==process.env.SOURCE_COMMIT||info.compiled.id!==process.env.BUILD_ID||info.sha256!==process.env.DMG_SHA256)throw Error('Wrong retained image');},buildInfo:()=>JSON.parse(readFileSync('dist/package/build.json')),install:target=>run(['scripts/install-dmg.mjs',target]),test:(exe,fixtureEnv)=>spawnSync('npx',[...INSTALLED_TEST_ARGS],{stdio:'inherit',env:fixtureEnv}),env});
          if(result.error)console.error(result.error.message);if(result.cleanupError)console.error(result.cleanupError.message);process.exitCode=result.exitCode;
          JS
          node ../../../scripts/no-leftovers.mjs node "$RUNNER_TEMP/qualify-retained.mjs"
      - name: Record exact image and qualification outcomes
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          INSTALLED_OUTCOME: ${{ steps.installed.outcome }}
        working-directory: /private/tmp/backbone-public-source
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';import {join} from 'node:path';import {createHash} from 'node:crypto';import {execFileSync} from 'node:child_process';
          const out=join(process.env.RUNNER_TEMP,'image-qualification'),dmg=join(out,'original-build/backbone-0.2.0-arm64.dmg');const sha=createHash('sha256').update(readFileSync(dmg)).digest('hex');if(sha!==process.env.DMG_SHA256)throw Error('Retained image changed');
          const clean=execFileSync('git',['status','--porcelain'],{encoding:'utf8'}).trim()==='';if(!clean)throw Error('Tracked source changed during qualification');
          writeFileSync(join(out,'qualification.json'),JSON.stringify({sourceCommit:process.env.SOURCE_COMMIT,dmgSha256:sha,compiledBuildId:process.env.BUILD_ID,buildRunId:43711121221,qualificationRunId:process.env.GITHUB_RUN_ID,qualificationRunUrl:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,qualificationWorkflow:process.env.GITHUB_SHA,fullSelection:true,expectedTests:51,preflightOutcome:process.env.PREFLIGHT_OUTCOME,installedOutcome:process.env.INSTALLED_OUTCOME,sourceStillClean:clean,macOS:execFileSync('sw_vers',['-productVersion'],{encoding:'utf8'}).trim(),runnerImageVersion:process.env.ImageVersion,node:process.version},null,2)+'\n');
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: retained-image-qualification
          path: |
            ${{ runner.temp }}/image-qualification/preflight.json
            ${{ runner.temp }}/image-qualification/preflight.log
            ${{ runner.temp }}/image-qualification/*-waiting.png
            ${{ runner.temp }}/image-qualification/qualification.json
            /private/tmp/backbone-public-source/evidence/J-01/
          if-no-files-found: warn
          retention-days: 3
