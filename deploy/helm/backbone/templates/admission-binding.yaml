{
  "apiVersion": "admissionregistration.k8s.io/v1",
  "kind": "ValidatingAdmissionPolicyBinding",
  "metadata": {
    "name": {{ include "fleet.admissionName" . | toJson }}
  },
  "spec": {
    "policyName": {{ include "fleet.admissionName" . | toJson }},
    "validationActions": [
      "Deny"
    ],
    "matchResources": {
      "namespaceSelector": {
        "matchLabels": {
          "kubernetes.io/metadata.name": {{ .Release.Namespace | toJson }}
        }
      }
    }
  }
}
