{
  "apiVersion": "admissionregistration.k8s.io/v1",
  "kind": "ValidatingAdmissionPolicy",
  "metadata": {
    "name": {{ include "fleet.admissionName" . | toJson }}
  },
  "spec": {
    "failurePolicy": "Fail",
    "matchConstraints": {
      "resourceRules": [
        {
          "apiGroups": [
            "batch"
          ],
          "apiVersions": [
            "v1"
          ],
          "operations": [
            "CREATE"
          ],
          "resources": [
            "jobs"
          ],
          "scope": "Namespaced"
        }
      ]
    },
    "matchConditions": [
      {
        "name": "rollout-identity",
        "expression": {{ printf "request.userInfo.username == %s" (printf "system:serviceaccount:%s:%s-rollout" .Release.Namespace .Release.Name | toJson) | toJson }}
      }
    ],
    "validations": [
      {
        "expression": "object.spec.parallelism == 1 && object.spec.completions == 1 && object.spec.backoffLimit == 0",
        "message": "Only the fixed home backup template is allowed."
      },
      {
        "expression": "object.spec.template.spec.automountServiceAccountToken == false && (!has(object.spec.template.spec.serviceAccountName) || object.spec.template.spec.serviceAccountName == 'default')",
        "message": "Only the fixed home backup template is allowed."
      },
      {
        "expression": "object.spec.template.spec.restartPolicy == 'Never' && (!has(object.spec.template.spec.hostNetwork) || !object.spec.template.spec.hostNetwork) && (!has(object.spec.template.spec.hostPID) || !object.spec.template.spec.hostPID) && (!has(object.spec.template.spec.hostIPC) || !object.spec.template.spec.hostIPC)",
        "message": "Only the fixed home backup template is allowed."
      },
      {
        "expression": "object.spec.template.spec.securityContext.seccompProfile.type == 'RuntimeDefault' && !has(object.spec.template.spec.securityContext.fsGroup)",
        "message": "Only the fixed home backup template is allowed."
      },
      {
        "expression": "object.spec.template.spec.containers.size() == 1 && object.spec.template.spec.containers.all(c, c.name == 'home' && c.command.size() == 3 && c.command[0] == 'node' && c.command[1] == '/fleet/backup.mjs' && c.command[2].matches('^/backups/archives/revision-[0-9]+$') && !has(c.args) && c.securityContext.runAsUser == 1000 && c.securityContext.runAsGroup == 1000 && c.securityContext.runAsNonRoot && !c.securityContext.allowPrivilegeEscalation && c.securityContext.readOnlyRootFilesystem && c.securityContext.capabilities.drop == ['ALL'] && (!has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.size() == 0) && (!has(c.securityContext.privileged) || !c.securityContext.privileged) && (!has(c.envFrom) || c.envFrom.size() == 0))",
        "message": "Only the fixed home backup template is allowed."
      },
      {
        "expression": "object.spec.template.spec.initContainers.size() == 2 && object.spec.template.spec.initContainers.all(c, c.command == ['node', c.name == 'prepare' ? '/fleet/prepare.mjs' : '/fleet/pg-cache.mjs'] && c.name in ['prepare','postgres-cache'] && !has(c.args) && c.securityContext.runAsUser == 0 && c.securityContext.runAsGroup == 0 && !c.securityContext.allowPrivilegeEscalation && c.securityContext.readOnlyRootFilesystem && c.securityContext.capabilities.drop == ['ALL'] && c.securityContext.capabilities.add == ['CHOWN'] && (!has(c.securityContext.privileged) || !c.securityContext.privileged))",
        "message": "Only the fixed home backup template is allowed."
      },
      {
        "expression": "object.spec.template.spec.volumes.size() == 7 && object.spec.template.spec.volumes.all(v, v.name in ['data','backups','policy','policy-source','runtime','pg-runtime','scratch'] && !has(v.hostPath) && !has(v.secret) && !has(v.projected) && !has(v.csi))",
        "message": "Only the fixed home backup template is allowed."
      },
      {
        "expression": {{ printf "object.spec.template.spec.containers.all(c, c.image == %s) && object.spec.template.spec.initContainers.all(c, c.image == %s)" (printf "%s@%s" .Values.image.repository .Values.image.digest | toJson) (printf "%s@%s" .Values.image.repository .Values.image.digest | toJson) | toJson }},
        "message": "Only the fixed home backup template is allowed."
      },
      {
        "expression": {{ include "fleet.backupTemplate" . | toJson }},
        "message": "Only the fixed home backup template is allowed."
      },
{
      "expression": "object.spec.template.spec.containers.all(c, !has(c.lifecycle) && !has(c.livenessProbe) && !has(c.readinessProbe) && !has(c.startupProbe) && c.env.all(e, e.name in ['BACKBONE_HOME','BACKBONE_KEYS','BACKBONE_EXPERIMENTAL_LINUX_HOME_LOCK','BACKBONE_MODEL_ENDPOINT','BACKBONE_MODEL_ID','BACKBONE_POSTGRES_NATIVE','BACKBONE_PLAINTEXT_TRIAL_ACK','BACKBONE_BACKUP_ROOT','BACKBONE_BACKUP_RETENTION'] && !has(e.valueFrom)) && c.env.all(e, c.env.filter(x, x.name == e.name).size() == 1 && (e.name != 'BACKBONE_POSTGRES_NATIVE' || e.value == '/pg-runtime/package/native') && (e.name != 'BACKBONE_KEYS' || e.value == 'plaintext') && (e.name != 'BACKBONE_EXPERIMENTAL_LINUX_HOME_LOCK' || e.value == '1') && (e.name != 'BACKBONE_BACKUP_RETENTION' || e.value.matches('^([1-9]|[1-4][0-9]|50)$'))) && c.env.exists(e, e.name == 'BACKBONE_HOME' && e.value == '/data/home') && c.env.exists(e, e.name == 'BACKBONE_BACKUP_ROOT' && e.value == '/backups/archives'))",
      "message": "Backup mounts, environment and commands cannot be redirected."
},
{
      "expression": "object.spec.template.spec.containers.all(c, c.volumeMounts.size() == 6 && c.volumeMounts.all(m, !has(m.subPath) && !has(m.subPathExpr) && ((m.name == 'data' && m.mountPath == '/data') || (m.name == 'backups' && m.mountPath == '/backups') || (m.name == 'pg-runtime' && m.mountPath == '/pg-runtime') || (m.name == 'scratch' && m.mountPath == '/tmp') || (m.name == 'policy' && m.mountPath == '/etc/backbone' && m.readOnly) || (m.name == 'runtime' && m.mountPath == '/fleet' && m.readOnly))))",
      "message": "Backup mounts, environment and commands cannot be redirected."
},
{
      "expression": "object.spec.template.spec.initContainers.all(c, (!has(c.envFrom) || c.envFrom.size() == 0) && (!has(c.env) || c.env.all(e, e.name == 'BACKBONE_BACKUP_ROOT' && e.value == '/backups/archives')) && !has(c.lifecycle) && c.volumeMounts.all(m, !has(m.subPath) && !has(m.subPathExpr) && ((m.name == 'data' && m.mountPath == '/data') || (m.name == 'backups' && m.mountPath == '/backups') || (m.name == 'policy' && m.mountPath == '/etc/backbone') || (m.name == 'policy-source' && m.mountPath == '/policy-source' && m.readOnly) || (m.name == 'runtime' && m.mountPath == '/fleet' && m.readOnly) || (m.name == 'pg-runtime' && m.mountPath == '/pg-runtime') || (m.name == 'scratch' && m.mountPath == '/tmp'))))",
      "message": "Backup mounts, environment and commands cannot be redirected."
}
    ]
  }
}
