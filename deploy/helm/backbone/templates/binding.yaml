{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "RoleBinding",
  "metadata": {
    "name": {{ printf "%s-rollout" .Release.Name | toJson }}
  },
  "roleRef": {
    "apiGroup": "rbac.authorization.k8s.io",
    "kind": "Role",
    "name": {{ printf "%s-rollout" .Release.Name | toJson }}
  },
  "subjects": [
    {
      "kind": "ServiceAccount",
      "name": {{ printf "%s-rollout" .Release.Name | toJson }},
      "namespace": {{ .Release.Namespace | toJson }}
    }
  ]
}
