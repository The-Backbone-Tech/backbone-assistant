{{ include "fleet.validate" . }}
{{ range .Values.homes }}
---
{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": {{ printf "%s-%s" $.Release.Name .name | toJson }},
    "labels": {
      "app.kubernetes.io/instance": {{ $.Release.Name | toJson }},
      "app.kubernetes.io/component": "home",
      "backbone.home": {{ .name | toJson }}
    }
  },
  "spec": {
    "serviceName": {{ printf "%s-%s" $.Release.Name .name | toJson }},
    "replicas": 1,
    "updateStrategy": {
      "type": "OnDelete"
    },
    "persistentVolumeClaimRetentionPolicy": {
      "whenDeleted": "Retain",
      "whenScaled": "Retain"
    },
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/instance": {{ $.Release.Name | toJson }},
        "app.kubernetes.io/component": "home",
        "backbone.home": {{ .name | toJson }}
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/instance": {{ $.Release.Name | toJson }},
          "app.kubernetes.io/component": "home",
          "backbone.home": {{ .name | toJson }}
        },
        "annotations": {
          "backbone.config": {{ toJson . | sha256sum | toJson }},
          "backbone.runtime": {{ ($.Files.Glob "files/*").AsConfig | sha256sum | toJson }}
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "securityContext": {
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "terminationGracePeriodSeconds": 120,
        "initContainers": [
          {
            "name": "prepare",
            "image": {{ printf "%s@%s" $.Values.image.repository $.Values.image.digest | toJson }},
            "command": [
              "node",
              "/fleet/prepare.mjs"
            ],
            "securityContext": {
              "runAsUser": 0,
              "runAsGroup": 0,
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ],
                "add": [
                  "CHOWN"
                ]
              }
            },
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/data"
              },
              {
                "name": "policy",
                "mountPath": "/etc/backbone"
              },
              {
                "name": "policy-source",
                "mountPath": "/policy-source",
                "readOnly": true
              },
              {
                "name": "runtime",
                "mountPath": "/fleet",
                "readOnly": true
              }
            ]
          },
          {
            "name": "postgres-cache",
            "image": {{ printf "%s@%s" $.Values.image.repository $.Values.image.digest | toJson }},
            "command": [
              "node",
              "/fleet/pg-cache.mjs"
            ],
            "securityContext": {
              "runAsUser": 0,
              "runAsGroup": 0,
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ],
                "add": [
                  "CHOWN"
                ]
              }
            },
            "volumeMounts": [
              {
                "name": "pg-runtime",
                "mountPath": "/pg-runtime"
              },
              {
                "name": "scratch",
                "mountPath": "/tmp"
              },
              {
                "name": "runtime",
                "mountPath": "/fleet",
                "readOnly": true
              }
            ]
          }
        ],
        "containers": [
          {
            "name": "home",
            "image": {{ printf "%s@%s" $.Values.image.repository $.Values.image.digest | toJson }},
            "imagePullPolicy": "IfNotPresent",
            "securityContext": {
              "runAsUser": 1000,
              "runAsGroup": 1000,
              "runAsNonRoot": true,
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "env": [
              {
                "name": "BACKBONE_HOME",
                "value": "/data/home"
              },
              {
                "name": "BACKBONE_KEYS",
                "value": "plaintext"
              },
              {
                "name": "BACKBONE_EXPERIMENTAL_LINUX_HOME_LOCK",
                "value": "1"
              },
              {
                "name": "BACKBONE_MODEL_ENDPOINT",
                "value": {{ .modelRoute.endpoint | toJson }}
              },
              {
                "name": "BACKBONE_MODEL_ID",
                "value": {{ .modelRoute.model | toJson }}
              },
              {
                "name": "BACKBONE_POSTGRES_NATIVE",
                "value": "/pg-runtime/package/native"
              },
              {
                "name": "BACKBONE_PLAINTEXT_TRIAL_ACK",
                "value": "I_ACCEPT_PLAINTEXT_KEYS_ON_THE_DATA_VOLUME"
              }
            ],
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/data"
              },
              {
                "name": "policy",
                "mountPath": "/etc/backbone",
                "readOnly": true
              },
              {
                "name": "runtime",
                "mountPath": "/fleet",
                "readOnly": true
              },
              {
                "name": "pg-runtime",
                "mountPath": "/pg-runtime"
              },
              {
                "name": "scratch",
                "mountPath": "/tmp"
              }
            ],
            "command": [
              "node",
              "/fleet/start.mjs"
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              },
              "limits": {
                "memory": "1Gi"
              }
            },
            "readinessProbe": {
              "exec": {
                "command": [
                  "node",
                  "/fleet/ready.mjs"
                ]
              },
              "periodSeconds": 10,
              "timeoutSeconds": 30,
              "failureThreshold": 3
            },
            "startupProbe": {
              "exec": {
                "command": [
                  "node",
                  "/fleet/ready.mjs"
                ]
              },
              "periodSeconds": 10,
              "timeoutSeconds": 30,
              "failureThreshold": 60
            }
          }
        ],
        "volumes": [
          {
            "name": "policy",
            "emptyDir": {}
          },
          {
            "name": "policy-source",
            "configMap": {
              "name": {{ printf "%s-%s" $.Release.Name .name | toJson }},
              "defaultMode": 292
            }
          },
          {
            "name": "runtime",
            "configMap": {
              "name": {{ include "fleet.runtime" $ | toJson }},
              "defaultMode": 292
            }
          },
          {
            "name": "pg-runtime",
            "emptyDir": {
              "sizeLimit": "512Mi"
            }
          },
          {
            "name": "scratch",
            "emptyDir": {
              "sizeLimit": "128Mi"
            }
          }
        ]
      }
    },
    "volumeClaimTemplates": [
      {
        "metadata": {
          "name": "data"
        },
        "spec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "storageClassName": {{ $.Values.storage.className | toJson }},
          "resources": {
            "requests": {
              "storage": {{ $.Values.storage.size | toJson }}
            }
          }
        }
      }
    ]
  }
}
{{ end }}
