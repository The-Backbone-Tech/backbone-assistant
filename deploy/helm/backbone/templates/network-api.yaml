{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": {{ printf "%s-api-egress" .Release.Name | toJson }}
  },
  "spec": {
    "podSelector": {
      "matchLabels": {
        "app.kubernetes.io/instance": {{ .Release.Name | toJson }},
        "app.kubernetes.io/component": "rollout"
      }
    },
    "policyTypes": [
      "Egress"
    ],
    "egress": [
      {
        "to": [
          {
            "namespaceSelector": {
              "matchLabels": {
                "kubernetes.io/metadata.name": "kube-system"
              }
            },
            "podSelector": {
              "matchLabels": {
                "k8s-app": "kube-dns"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "UDP",
            "port": 53
          },
          {
            "protocol": "TCP",
            "port": 53
          }
        ]
      },
      {
        "to": {{ include "fleet.apiPeers" . }},
        "ports": [
          {
            "protocol": "TCP",
            "port": 443
          },
          {
            "protocol": "TCP",
            "port": 6443
          }
        ]
      }
    ]
  }
}
