{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": {{ printf "%s-deny" .Release.Name | toJson }}
  },
  "spec": {
    "podSelector": {
      "matchLabels": {
        "app.kubernetes.io/instance": {{ .Release.Name | toJson }}
      }
    },
    "policyTypes": [
      "Ingress",
      "Egress"
    ],
    "ingress": [],
    "egress": []
  }
}
