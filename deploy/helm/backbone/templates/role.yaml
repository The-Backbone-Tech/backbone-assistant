{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "Role",
  "metadata": {
    "name": {{ printf "%s-rollout" .Release.Name | toJson }}
  },
  "rules": [
    {
      "apiGroups": [
        "apps"
      ],
      "resources": [
        "statefulsets"
      ],
      "verbs": [
        "get"
      ],
      "resourceNames": {{ include "fleet.homeNames" . }}
    },
    {
      "apiGroups": [
        "apps"
      ],
      "resources": [
        "statefulsets/scale"
      ],
      "verbs": [
        "get",
        "patch"
      ],
      "resourceNames": {{ include "fleet.homeNames" . }}
    },
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "pods"
      ],
      "verbs": [
        "get",
        "delete"
      ],
      "resourceNames": {{ include "fleet.podNames" . }}
    },
    {
      "apiGroups": [
        "batch"
      ],
      "resources": [
        "jobs"
      ],
      "verbs": [
        "get",
        "delete"
      ],
      "resourceNames": {{ include "fleet.backupNames" . }}
    },
    {
      "apiGroups": [
        "batch"
      ],
      "resources": [
        "jobs"
      ],
      "verbs": [
        "create"
      ]
    }
  ]
}
