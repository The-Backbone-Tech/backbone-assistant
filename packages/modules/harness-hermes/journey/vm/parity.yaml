# Disposable parity VM: no host mounts, no forwarded ports or agents, synthetic data only.
vmType: vz
plain: true
cpus: 4
memory: 6GiB
disk: 16GiB
images:
- location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: aarch64
mounts: []
ssh:
  forwardAgent: false
  forwardX11: false
containerd:
  system: false
  user: false
